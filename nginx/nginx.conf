worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Rate limiting zones ──
    # General API: 30 requests/second per IP with burst of 20
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Login: 1 request per 3 seconds per IP (strict brute-force protection)
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/3s;

    upstream app {
        server money-tracker-app:4000;
        # Add more backends here for horizontal scaling:
        # server money-tracker-app-2:4000;
    }

    server {
        listen 80;
        server_name money-tracker.local localhost;

        # ── Security headers ──
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Allow large backup uploads (25MB matches Express body limit)
        client_max_body_size 25m;

        # ── Static assets — long cache with immutable ──
        # Vite uses content-hashed filenames, so they can be cached forever.
        location /assets/ {
            proxy_pass http://app;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Login endpoint — strict rate limit ──
        location = /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API endpoints — general rate limit ──
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for AI endpoints which can take longer
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Health check — no rate limit, no logging ──
        location = /api/health {
            proxy_pass http://app;
            access_log off;
        }

        # ── SPA fallback ──
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
