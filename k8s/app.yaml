apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-backups-pvc
  namespace: money-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-health-reports-pvc
  namespace: money-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: money-tracker-app
  namespace: money-tracker
  labels:
    app: money-tracker-app
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
  selector:
    app: money-tracker-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: money-tracker-app
  namespace: money-tracker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: money-tracker-app
  template:
    metadata:
      labels:
        app: money-tracker-app
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: app
          image: money-tracker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: money-tracker-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: money-tracker-secrets
                  key: DB_PASSWORD
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: money-tracker-secrets
                  key: AUTH_USERNAME
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: money-tracker-secrets
                  key: AUTH_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: money-tracker-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: backups
              mountPath: /app/backups
            - name: health-reports
              mountPath: /app/uploads/health-reports
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: app-backups-pvc
        - name: health-reports
          persistentVolumeClaim:
            claimName: app-health-reports-pvc
---
# HorizontalPodAutoscaler — scales from 2 to 5 replicas based on CPU usage
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: money-tracker-app-hpa
  namespace: money-tracker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: money-tracker-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
# PodDisruptionBudget — always keep at least 1 pod running during voluntary disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: money-tracker-app-pdb
  namespace: money-tracker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: money-tracker-app
