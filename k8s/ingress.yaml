# Nginx Ingress for Kubernetes
# Requires: NGINX Ingress Controller installed in the cluster
# Install: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.0/deploy/static/provider/cloud/deploy.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: money-tracker-ingress
  namespace: money-tracker
  annotations:
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # Gzip compression
    nginx.ingress.kubernetes.io/enable-gzip: "true"
    nginx.ingress.kubernetes.io/gzip-min-length: "1000"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Body size for backup upload
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    # SSL redirect (uncomment when TLS is configured)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - money-tracker.yourdomain.com
  #     secretName: money-tracker-tls
  rules:
    - host: money-tracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: money-tracker-app
                port:
                  number: 4000
---
# NetworkPolicy: only the app pods can talk to the DB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-app-only
  namespace: money-tracker
spec:
  podSelector:
    matchLabels:
      app: money-tracker-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: money-tracker-app
      ports:
        - port: 3306
          protocol: TCP
